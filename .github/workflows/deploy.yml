name: Deploy to Google Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image for linux/amd64
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_CLIENT_ID=${{ secrets.NEXT_PUBLIC_CLIENT_ID }} \
            --build-arg CLIENT_ID=${{ secrets.CLIENT_ID }} \
            --build-arg CLIENT_SECRET=${{ secrets.CLIENT_SECRET }} \
            --build-arg TOKEN_URL=${{ secrets.TOKEN_URL }} \
            --build-arg SPOTIFY_API_URL=${{ secrets.SPOTIFY_API_URL }} \
            -t ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/statify/statify:latest \
            --push .

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy statify \
            --image=${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/statify/statify:latest \
            --platform=managed \
            --region=${{ secrets.GCP_REGION }} \
            --allow-unauthenticated \
            --port=4173 \
            --set-env-vars NEXT_PUBLIC_CLIENT_ID=${{ secrets.NEXT_PUBLIC_CLIENT_ID }} \
            --set-env-vars CLIENT_ID=${{ secrets.CLIENT_ID }} \
            --set-env-vars CLIENT_SECRET=${{ secrets.CLIENT_SECRET }} \
            --set-env-vars TOKEN_URL=${{ secrets.TOKEN_URL }} \
            --set-env-vars SPOTIFY_API_URL=${{ secrets.SPOTIFY_API_URL }}